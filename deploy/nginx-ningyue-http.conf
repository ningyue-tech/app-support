# Independent virtual host example. Inspect existing nginx -T before installing.
# This HTTP block is for staging / ACME; exam login requires HTTPS in production.
server {
    listen 80;
    server_name ningyue.xyz www.ningyue.xyz;

    root /srv/ningyue/current;
    index index.html;
    autoindex off;
    charset utf-8;
    etag on;

    access_log /var/log/nginx/ningyue-access.log;
    error_log /var/log/nginx/ningyue-error.log;

    # Default content types must be included by the parent nginx http block.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Always revalidate HTML, scripts and whitelist changes after a deployment.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}
