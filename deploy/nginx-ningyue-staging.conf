# Standalone, loopback-only staging configuration; not an http{} include fragment.
# Start explicitly with nginx -c /absolute/path/nginx-ningyue-staging.conf.
worker_processes 1;
pid /run/nginx-ningyue-staging.pid;
error_log /var/log/nginx/ningyue-staging-error.log;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 15;
    access_log /var/log/nginx/ningyue-staging-access.log;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /srv/ningyue/current;
        index home.html index.html;
        autoindex off;
        charset utf-8;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
